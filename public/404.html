<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Linkspace</title>
    <script type="text/javascript">
      // GitHub Pages Single Page Application redirect script
      // If deployed on user page root (e.g. strudelcode.github.io/user), pathSegmentsToKeep is 0.
      var l = window.location;
      var pathSegmentsToKeep = (l.hostname.endsWith('github.io') && l.pathname.indexOf('/linkspace') === 0) ? 1 : 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
