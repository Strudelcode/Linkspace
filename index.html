<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkspace</title>
    <meta name="description" content="Erstelle deine individuelle Link-in-Bio Seite mit Linkspace." />
    <link rel="icon" type="image/svg+xml" href="/app_icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
    <script type="text/javascript">
      // 1. Ensure trailing slash on GitHub Pages repository root so relative assets (./assets/...) resolve properly
      (function(l) {
        if (l.hostname.endsWith('github.io')) {
          var segments = l.pathname.split('/').filter(Boolean);
          if (segments.length === 1 && !l.pathname.endsWith('/')) {
            l.replace(l.protocol + '//' + l.host + '/' + segments[0] + '/' + (l.search || '') + (l.hash || ''));
            return;
          }
        }
      }(window.location));

      // 2. Restore path if redirected from 404.html
      (function(l) {
        if (l.search && l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.replace(/\/+$/, '');
          window.history.replaceState(null, null,
              basePath + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
