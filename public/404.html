<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Linkspace</title>
    <script type="text/javascript">
      // GitHub Pages Single Page Application redirect script
      var l = window.location;
      var isGithubPages = l.hostname.endsWith('github.io');
      var pathParts = l.pathname.split('/').filter(Boolean);
      var pathSegmentsToKeep = (isGithubPages && pathParts.length >= 1) ? 1 : 0;
      var repoBase = (pathSegmentsToKeep === 1) ? '/' + pathParts[0] : '';
      var routePath = pathParts.slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/?/' + routePath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
