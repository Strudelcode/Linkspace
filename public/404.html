<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Linkspace</title>
    <script type="text/javascript">
      // GitHub Pages Single Page Application redirect script
      var l = window.location;
      var isGithubPages = l.hostname.endsWith('github.io');
      var pathSegmentsToKeep = isGithubPages ? 1 : 0;
      var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/?/' + routePath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
